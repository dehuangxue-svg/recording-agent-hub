name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Run tests
        shell: powershell
        run: uv run python -m unittest discover -s tests -v

      - name: Build portable app and installer
        shell: powershell
        run: .\scripts\build_windows.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Recording-Agent-Hub-Windows-x64
          path: |
            dist/Recording-Agent-Hub-Windows-x64-Portable.zip
            dist/Recording-Agent-Hub-Windows-x64-Setup.exe

      - name: Attach files to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Recording-Agent-Hub-Windows-x64-Portable.zip
            dist/Recording-Agent-Hub-Windows-x64-Setup.exe
